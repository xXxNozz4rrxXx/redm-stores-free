<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="css/style.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <main id="objects_shop" aria-label="Codex Stores">
        <section class="codex-window">
            <div class="codex-border top-left"></div>
            <div class="codex-border top-right"></div>
            <div class="codex-border bottom-left"></div>
            <div class="codex-border bottom-right"></div>

            <header class="codex-header">
                <div class="codex-seal" aria-hidden="true">
                    <svg viewBox="0 0 64 64">
                        <path d="M10 52h44" />
                        <path d="M17 52V29h30v23" />
                        <path d="M13 29h38L32 12 13 29z" />
                        <path d="M27 52V40h10v12" />
                        <path d="M22 36h7v7h-7zM35 36h7v7h-7z" />
                        <path d="M32 12V7M28 9h8" />
                    </svg>
                </div>

                <div class="codex-title-wrap">
                    <h1 id="shop_opened_title_display">Codex Store</h1>
                    <div class="codex-subtitle-row">
                        <span></span>
                        <p id="shop_opened_title_footer">General Goods &amp; Supplies</p>
                        <span></span>
                    </div>
                </div>

                <button id="shop_back_button" type="button" class="codex-back">Back</button>
            </header>

            <form id="enable_shop" autocomplete="off">
                <nav class="codex-tabs" aria-hidden="true">
                    <div class="codex-tab active">
                        <svg viewBox="0 0 64 64"><path d="M10 29 29 10h16l9 9v16L35 54 10 29z"/><circle cx="40" cy="23" r="3"/></svg>
                        <strong>Departments</strong>
                    </div>
                    <div class="codex-tab">
                        <svg viewBox="0 0 64 64"><path d="M22 20c3 4 17 4 20 0"/><path d="M25 20c0-5 3-9 7-9s7 4 7 9"/><path d="M18 25l4 28h20l4-28c-7 4-21 4-28 0z"/></svg>
                        <strong>All Items</strong>
                    </div>
                    <div class="codex-tab">
                        <svg viewBox="0 0 64 64"><path d="m32 9 7 15 16 2-12 11 3 16-14-8-14 8 3-16L9 26l16-2z"/></svg>
                        <strong>Featured</strong>
                    </div>
                </nav>

                <section class="codex-content">
                    <section class="categories_menu codex-page">
                        <div class="codex-section-title">
                            <i></i><strong>Store Departments</strong><i></i>
                        </div>
                        <div id="categories" class="codex-list"></div>
                    </section>

                    <section class="type_categories_menu codex-page">
                        <div class="codex-section-title">
                            <i></i><strong>Transaction Type</strong><i></i>
                        </div>
                        <div id="types" class="codex-list"></div>
                    </section>

                    <section class="category_products codex-page products-page">
                        <div class="codex-toolbar">
                            <div id="player_account_information_text">You have $0</div>
                            <input id="products_search_input" type="text" placeholder="Search items..." />
                        </div>

                        <div id="products" class="codex-products"></div>

                        <footer class="codex-action-bar">
                            <div class="codex-selected">
                                <span>Selected Item</span>
                                <strong id="products_selected_item_display">Not Selected</strong>
                            </div>

                            <div class="codex-amount">
                                <button id="amount_minus_button" type="button">−</button>
                                <input id="products_item_amount_input" type="text" value="1" onkeypress="return onNumbers(event)" />
                                <button id="amount_plus_button" type="button">+</button>
                            </div>

                            <button id="products_action_button" type="button" class="codex-primary">BUY</button>
                        </footer>
                    </section>

                    <section class="object_dialog codex-page">
                        <div id="objects" class="codex-products"></div>
                        <div id="object_dialog_model_title"></div>
                        <div class="object-actions">
                            <button id="object_dialog_display_button" type="button">DISPLAY</button>
                            <button id="object_dialog_rotate_l_button" type="button">←</button>
                            <button id="object_dialog_rotate_r_button" type="button">→</button>
                        </div>
                    </section>
                </section>

                <footer class="codex-footer" aria-hidden="true">
                    <div><kbd>ENTER</kbd><span>Select</span></div>
                    <p>Thank you for your business.</p>
                    <div><kbd>ESC</kbd><span>Back</span></div>
                </footer>
            </form>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/script.js" type="text/javascript"></script>
</body>
</html>
